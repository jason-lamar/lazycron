[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lazycron"
version = "0.1.0"
description = "A LazyGit-style TUI for managing cron jobs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Jason Lamar"},
]
keywords = ["cron", "crontab", "tui", "terminal", "curses"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

[project.scripts]
lazycron = "lazycron.app:main"

[project.urls]
Homepage = "https://github.com/jason-lamar/lazycron"
Repository = "https://github.com/jason-lamar/lazycron"
Issues = "https://github.com/jason-lamar/lazycron/issues"

[tool.setuptools.packages.find]
include = ["lazycron*"]
